name: Optional AMD GPU CI

on:
  workflow_dispatch:
    inputs:
      run_gpu_checks:
        description: "Run on a trusted self-hosted AMD/ROCm runner"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  amd-gpu:
    if: ${{ inputs.run_gpu_checks && vars.ENABLE_AMD_GPU_CI == 'true' }}
    runs-on: [self-hosted, linux, x64, amd-gpu, rocm]
    timeout-minutes: 45
    concurrency:
      group: amd-gpu-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify pre-provisioned ROCm environment
        run: |
          test -x .venv/bin/python
          hipcc --version
          rocminfo
          .venv/bin/python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.cuda.get_device_name(0))"
      - name: Compile and run HIP parity checks
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_hip_parity.py::test_hip_integrated_modes_match_pytorch \
            tests/test_hip_parity.py::test_hip_wmma_fp16_matches_pytorch \
            tests/test_hip_parity.py::test_hip_wmma_int8_matches_pytorch
