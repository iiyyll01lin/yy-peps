schema_version = 1
name = "image-table1-full"
paper = "PEPS Extended arXiv:2604.24167v1"
task = "image"
profile = "full"
dataset = "kodak-24-original"
canonical = true
seeds = [0, 1, 2]

[training]
task = "image"
loss = "l2"
steps = 120000
batch_size = 60000
model_lr = 0.001
encoder_lr = 0.1
cosine = true
log_every = 500
checkpoint_every = 5000

[runner]
metrics = ["psnr", "flip", "lpips", "lsd", "ssim"]
render_chunk = 262144
output_dir = "results/paper"
world_size = 4
protocol_note = "Published Table 1 values equal the appendix L2/GELU/dual-LR row despite the main-text L1 narrative. Image steps remain undisclosed; 120000 is a recorded sensitivity assumption."

[[methods]]
name = "PE"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "pe", activation = "gelu" }
expected_encoder_params = 0

[[methods]]
name = "LPE"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "lpe", activation = "gelu" }
expected_encoder_params = 401408

[[methods]]
name = "NTC_N"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "ntc_n", activation = "gelu" }
expected_encoder_params = 417792

[[methods]]
name = "Grid"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "grid", activation = "gelu" }
expected_encoder_params = 426496

[[methods]]
name = "G-PEPS"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "g_peps", activation = "gelu" }
expected_encoder_params = 426496

[[methods]]
