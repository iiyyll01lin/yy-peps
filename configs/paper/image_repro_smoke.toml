schema_version = 1
name = "image-reproduction-full-resolution-smoke"
paper = "PEPS Extended arXiv:2604.24167v1"
task = "image"
profile = "smoke"
dataset = "kodak-24-original-full-resolution"
canonical = false
seeds = [0]

[training]
task = "image"
loss = "l2"
steps = 1
batch_size = 512
model_lr = 0.001
encoder_lr = 0.1
cosine = true
log_every = 1
checkpoint_every = 1

[runner]
metrics = ["psnr", "flip", "lpips", "lsd", "ssim"]
render_chunk = 262144
output_dir = "results/paper-smoke"
parallelism_mode = "job_shard"
world_size = 4
protocol_note = "Pipeline smoke only: all 24 checksum-verified original-size Kodak images and all nine Table 1 architectures, but one 512-sample optimizer step. Values are intentionally not paper-comparable."

[[methods]]
name = "PE"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "pe", activation = "gelu", output_activation = "none" }
expected_encoder_params = 0
expected_total_params = 194403

