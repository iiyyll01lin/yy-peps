schema_version = 1
name = "image-table5-l1-full"
paper = "PEPS Extended arXiv:2604.24167v1"
task = "image"
profile = "full"
dataset = "kodak-24-original"
canonical = true
seeds = [0, 1, 2]

[training]
task = "image"
loss = "l1"
steps = 120000
batch_size = 60000
model_lr = 0.01
encoder_lr = 0.01
cosine = false
log_every = 500
checkpoint_every = 500

[runner]
metrics = ["psnr", "ssim"]
render_chunk = 262144
output_dir = "results/paper"
parallelism_mode = "job_shard"
world_size = 4
protocol_note = "Table 5 L1/fixed-LR/LeakyReLU rows. Image steps, batch size, optimizer, output activation, and seeds are not reported; 120000/60000/Adam/linear output/three paired seeds are frozen sensitivity assumptions. L2/GELU/dual-cosine rows are reused from image_full.toml rather than retrained."

[[methods]]
name = "Grid-L1"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "grid", activation = "leaky_relu", output_activation = "none" }
role = "table5_l1"
expected_encoder_params = 426496
expected_total_params = 436163

[[methods]]
name = "G-P-PEPS-L1"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "g_p_peps", activation = "leaky_relu", output_activation = "none" }
role = "table5_l1"
expected_encoder_params = 426496
expected_total_params = 437955

[[methods]]
name = "NTC_N-L1"
factory = "apps.image.build:build_paper_image"
kwargs = { method = "ntc_n", activation = "leaky_relu", output_activation = "none" }
role = "table5_l1"
expected_encoder_params = 417792
expected_total_params = 431491
