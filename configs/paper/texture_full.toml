schema_version = 1
name = "texture-table2-full"
paper = "PEPS Extended arXiv:2604.24167v1"
task = "texture"
profile = "full"
dataset = "paper-textures-18-4k"
canonical = true
seeds = [0, 1, 2]

[training]
task = "texture"
loss = "l1"
epochs = 3000
batches_per_epoch = 40
batch_size = 60000
model_lr = 0.001
encoder_lr = 0.1
cosine = true
log_every = 200
checkpoint_every = 1000

[runner]
metrics = ["psnr", "ssim"]
render_chunk = 262144
output_dir = "results/paper"
world_size = 4

[[methods]]
name = "LPE"
factory = "apps.texture.build:build_paper_texture"
kwargs = { method = "lpe" }
expected_encoder_params = 16777216

